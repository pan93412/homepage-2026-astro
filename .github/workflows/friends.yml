name: Sync Friend Links

on:
  schedule:
    # Daily at 03:17 Asia/Taipei (GitHub schedules use UTC).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-friends
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read approved sheet entries
        run: bun run sync:friends
        env:
          FRIENDSHIP_GOOGLE_SHEET_ID: ${{ vars.FRIENDSHIP_GOOGLE_SHEET_ID }}
          FRIENDSHIP_GOOGLE_SHEET_NAME: ${{ vars.FRIENDSHIP_GOOGLE_SHEET_NAME }}
      - name: Commit changes and request deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/friends.yaml; then
            echo 'Friend links are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/friends.yaml
          git commit --signoff -m 'chore: sync friend links'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:master
          # GITHUB_TOKEN commits do not trigger push workflows. Dispatch explicitly.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            --data '{"ref":"master"}'
