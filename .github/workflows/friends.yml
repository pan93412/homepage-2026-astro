name: Sync Friend Links

on:
  schedule:
    # Daily at 03:17 Asia/Taipei (GitHub schedules use UTC).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-friends
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read approved sheet entries
        run: bun run sync:friends
        env:
          FRIENDSHIP_GOOGLE_SHEET_ID: ${{ vars.FRIENDSHIP_GOOGLE_SHEET_ID }}
          FRIENDSHIP_GOOGLE_SHEET_NAME: ${{ vars.FRIENDSHIP_GOOGLE_SHEET_NAME }}
      - name: Merge the changes through a pull request and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/sync-friends
          FILE: src/data/friends.yaml
          TITLE: "chore: sync friend links"
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FILE"; then
            echo 'Friend links are unchanged.'
            exit 0
          fi
          repo="repos/$GITHUB_REPOSITORY"
          base=$(git rev-parse HEAD)

          # Start the sync branch at the master commit this run read.
          if gh api "$repo/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api --method PATCH "$repo/git/refs/heads/$BRANCH" -f sha="$base" -F force=true --silent
          else
            gh api "$repo/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" --silent
          fi

          # GitHub signs commits that the Actions token makes through the API.
          commit=$(gh api --method PUT "$repo/contents/$FILE" \
            -f branch="$BRANCH" \
            -f sha="$(git rev-parse "HEAD:$FILE")" \
            -f content="$(base64 --wrap=0 "$FILE")" \
            -f message="$TITLE"$'\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            --jq .commit.sha)

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base master --title "$TITLE" \
              --body "Approved entries from the friendship form, synced by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.")
            pr=${url##*/}
          fi

          # Events from the Actions token start no workflows, so the pull request
          # gets no "build" check by itself. Dispatch the build on its head commit.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          run=
          for _ in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --event workflow_dispatch --commit "$commit" --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::No deploy.yml run started for $commit."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$commit"

          # The merge is a push by the Actions token, which starts no workflows. Deploy explicitly.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master
