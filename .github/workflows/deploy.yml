name: Bunny and Quality

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily at 03:47 Asia/Taipei (GitHub schedules use UTC), to refresh the GitHub stats.
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

concurrency:
  group: bunny-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Pull requests build with the committed numbers, so their output does not change by day.
      # If GitHub fails, the build keeps the committed numbers.
      - name: Read GitHub stats
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: bun run sync:stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - parallel:
          - name: Check workflow and Nix configuration
            run: nixfmt --check flake.nix && jactionlint
          - name: Lint, format and typecheck
            run: bun run check
          - name: Test data synchronization
            run: bun run test
          - name: Build static site
            run: bun run build
            env:
              PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
              PUBLIC_POSTHOG_API_HOST: ${{ vars.PUBLIC_POSTHOG_API_HOST }}
              PUBLIC_POSTHOG_UI_HOST: ${{ vars.PUBLIC_POSTHOG_UI_HOST }}
      - name: End-to-end tests
        run: bun run test:e2e
      - name: Upload end-to-end traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    environment:
      name: production
      url: https://pan93.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/ci-setup
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download static site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: dist/
      - name: Deploy to Bunny
        run: bun run deploy --site "$BUNNY_SITE"
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_SITE: ${{ vars.BUNNY_SITE }}
