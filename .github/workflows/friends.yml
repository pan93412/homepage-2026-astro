name: Sync Friend Links

on:
  schedule:
    # Daily at 03:17 Asia/Taipei (GitHub schedules use UTC).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-friends
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read approved sheet entries
        run: bun run sync:friends
        env:
          FRIENDSHIP_GOOGLE_SHEET_ID: ${{ vars.FRIENDSHIP_GOOGLE_SHEET_ID }}
          FRIENDSHIP_GOOGLE_SHEET_NAME: ${{ vars.FRIENDSHIP_GOOGLE_SHEET_NAME }}
      - name: Open the pull request as the bot
        id: pr
        uses: zeabur-oss/.github/actions/bot-pr@395adf27d31c77538ebf7c154946b52822387b96
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          branch: chore/sync-friends
          title: "chore: sync friend links"
          body: Approved entries from the friendship form.
          add-paths: src/data/friends.yaml
      - name: Get a bot token for auto-merge
        id: app
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The bot merges when "build" passes. Its push to master starts the deploy.
      - name: Turn on auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
