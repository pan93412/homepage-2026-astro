name: Nix cache GC

# A second GC run would race the first run's repack, so queue instead of overlapping.
concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; delete nothing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # The cache GC must run on the default branch.
    if: github.ref == 'refs/heads/master'
    permissions:
      actions: write
      contents: read
    steps:
      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          # renovate: depName=Mic92/hestia
          version: v3.1.0
      - name: Run garbage collection
        run: '"$HESTIA_BIN" gc ${{ inputs.dry-run && ''--dry-run'' || '''' }}'
        env:
          GITHUB_TOKEN: ${{ github.token }}
